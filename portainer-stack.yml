# =============================================================================
#  MeshVPN — Portainer Stack
# =============================================================================
#
#  HOW TO DEPLOY:
#  1. In Portainer → Stacks → Add stack
#  2. Paste this file (or point at the git repo)
#  3. Set environment variables listed below
#  4. Click "Deploy the stack"
#
#  REQUIRED ENVIRONMENT VARIABLES (set in Portainer UI):
#    MESH_NODE_NAME     e.g.  node-a
#    MESH_PUBLIC_IP     e.g.  192.168.1.10
#    ADMIN_PASSWORD     e.g.  changeme
#
#  OPTIONAL:
#    IMAGE_TAG          Image tag to deploy  (default: latest)
#    MESH_API_URL       Full public URL if behind NPM/proxy  e.g. https://vpn.example.com
#    MESH_MODE          leader (default) or join
#    MESH_JOIN_ADDR     https://vpn.leader.com or LEADER_IP:8080  (join mode only)
#    MESH_JOIN_TOKEN    token from leader UI   (join mode only)
#    MESH_PRIORITY      100 for leader, 50 for followers
#    MESH_API_PORT      8080
#    MESH_UI_PORT       3000
#    MESH_CLIENT_SUBNET 10.8.0.0/24
#    MESH_SUBNET        10.99.0.0/24
#
#  OPTIONAL SERVICES — set to "true" to enable (default: false = container exits cleanly):
#    ENABLE_WG          WireGuard manager
#    ENABLE_OPENVPN     OpenVPN server
#    ENABLE_HAPROXY     HAProxy TCP frontend (exposes port 443 to VPN clients)
#    ENABLE_ROUTER      ip route manager
#    ENABLE_CLOUDFLARE  Cloudflare DNS updater (also set CF_* vars below)
#
#  Images are published to ghcr.io/s-kroonen/meshvpn-<service>
#  via GitHub Actions on every push to main.
#
# =============================================================================

x-core-env: &core-env
  ENABLE_WG:               ${ENABLE_WG:-false}
  ENABLE_OPENVPN:          ${ENABLE_OPENVPN:-false}
  ENABLE_HAPROXY:          ${ENABLE_HAPROXY:-false}
  ENABLE_CLOUDFLARE:       ${ENABLE_CLOUDFLARE:-false}
  ENABLE_ROUTER:           ${ENABLE_ROUTER:-false}
  MESH_NODE_NAME:          ${MESH_NODE_NAME}
  MESH_PUBLIC_IP:          ${MESH_PUBLIC_IP}
  MESH_API_URL:            ${MESH_API_URL:-}
  MESH_WG_PORT:            ${MESH_WG_PORT:-51820}
  MESH_VPN_PORT:           ${MESH_VPN_PORT:-443}
  MESH_API_PORT:           ${MESH_API_PORT:-8080}
  MESH_UI_PORT:            ${MESH_UI_PORT:-3000}
  MESH_PRIORITY:           ${MESH_PRIORITY:-100}
  MESH_MODE:               ${MESH_MODE:-leader}
  MESH_JOIN_ADDR:          ${MESH_JOIN_ADDR:-}
  MESH_JOIN_TOKEN:         ${MESH_JOIN_TOKEN:-}
  MESH_JOIN_SSL_VERIFY:    ${MESH_JOIN_SSL_VERIFY:-true}
  MESH_CLIENT_SUBNET:      ${MESH_CLIENT_SUBNET:-10.8.0.0/24}
  MESH_SUBNET:             ${MESH_SUBNET:-10.99.0.0/24}
  MESH_ALLOWED_LAN:        ${MESH_ALLOWED_LAN:-192.168.100.0/24}
  MESH_ROUTING_MODE:       ${MESH_ROUTING_MODE:-weighted}
  MESH_ROUTING_WEIGHT:     ${MESH_ROUTING_WEIGHT:-100}
  MESH_HEALTH_INTERVAL:    ${MESH_HEALTH_INTERVAL:-3}
  MESH_FAILOVER_THRESHOLD: ${MESH_FAILOVER_THRESHOLD:-3}
  ADMIN_PASSWORD:          ${ADMIN_PASSWORD:-admin}
  CF_ENABLED:              ${CF_ENABLED:-false}
  CF_API_TOKEN:            ${CF_API_TOKEN:-}
  CF_ZONE_ID:              ${CF_ZONE_ID:-}
  CF_DOMAIN:               ${CF_DOMAIN:-vpn.yourdomain.com}
  CF_TTL:                  ${CF_TTL:-60}

services:

  # ── Core mesh daemon ─────────────────────────────────────────────────────────
  core:
    image: ghcr.io/s-kroonen/meshvpn-core:${IMAGE_TAG:-latest}
    ports:
      - "${MESH_API_PORT:-8080}:8080"
    volumes:
      - meshvpn-data:/data
    environment:
      <<: *core-env
    networks:
      - meshvpn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Web UI ───────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/s-kroonen/meshvpn-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${MESH_UI_PORT:-3000}:3000"
    networks:
      - meshvpn
    restart: unless-stopped
    depends_on:
      - core

  # ── WireGuard manager ────────────────────────────────────────────────────────
  # ENABLE_WG=true to activate, false (default) = container exits 0 and stays stopped.
  wg-manager:
    image: ghcr.io/s-kroonen/meshvpn-wg-manager:${IMAGE_TAG:-latest}
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_WG: "${ENABLE_WG:-false}"
      CORE_API: "http://127.0.0.1:${MESH_API_PORT:-8080}"
    restart: on-failure

  # ── ip route manager ─────────────────────────────────────────────────────────
  # ENABLE_ROUTER=true to activate.
  router:
    image: ghcr.io/s-kroonen/meshvpn-router:${IMAGE_TAG:-latest}
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_ROUTER: "${ENABLE_ROUTER:-false}"
      CORE_API: "http://127.0.0.1:${MESH_API_PORT:-8080}"
    restart: on-failure

  # ── OpenVPN server ───────────────────────────────────────────────────────────
  # ENABLE_OPENVPN=true to activate.
  openvpn:
    image: ghcr.io/s-kroonen/meshvpn-openvpn:${IMAGE_TAG:-latest}
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_OPENVPN: "${ENABLE_OPENVPN:-false}"
    restart: on-failure

  # ── HAProxy TCP frontend ──────────────────────────────────────────────────────
  # ENABLE_HAPROXY=true to activate. Required to expose port 443 to VPN clients.
  haproxy:
    image: ghcr.io/s-kroonen/meshvpn-haproxy:${IMAGE_TAG:-latest}
    ports:
      - "${MESH_VPN_PORT:-443}:443"
    networks:
      - meshvpn
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      ENABLE_HAPROXY: "${ENABLE_HAPROXY:-false}"
    restart: on-failure

  # ── Cloudflare DNS updater ────────────────────────────────────────────────────
  # ENABLE_CLOUDFLARE=true to activate. Also set CF_API_TOKEN, CF_ZONE_ID, CF_DOMAIN.
  cloudflare:
    image: ghcr.io/s-kroonen/meshvpn-cloudflare:${IMAGE_TAG:-latest}
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_CLOUDFLARE: "${ENABLE_CLOUDFLARE:-false}"
      CORE_API:     "http://core:${MESH_API_PORT:-8080}"
      CF_ENABLED:   ${CF_ENABLED:-false}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID:   ${CF_ZONE_ID:-}
      CF_DOMAIN:    ${CF_DOMAIN:-vpn.yourdomain.com}
      CF_TTL:       ${CF_TTL:-60}
    networks:
      - meshvpn
    restart: on-failure
    depends_on:
      - core


volumes:
  meshvpn-data:

networks:
  meshvpn:
    driver: bridge
