name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'frontend/**'
      - 'wg-manager/**'
      - 'router/**'
      - 'cloudflare/**'
      - 'openvpn/**'
      - 'haproxy/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to build (leave empty for all)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            dockerfile: core/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
          - service: wg-manager
            dockerfile: wg-manager/Dockerfile
          - service: router
            dockerfile: router/Dockerfile
          - service: cloudflare
            dockerfile: cloudflare/Dockerfile
          - service: openvpn
            dockerfile: openvpn/Dockerfile
          - service: haproxy
            dockerfile: haproxy/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths are case-sensitive on push but portainer-stack.yml hardcodes
      # lowercase image paths (e.g. ghcr.io/s-kroonen/...), so force lowercase
      # here to avoid a "pushed to S-Kroonen, pulled from s-kroonen" mismatch.
      - name: Lowercase owner
        id: owner
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/meshvpn-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
