# =============================================================================
#  MeshVPN — Docker Compose  (local dev + Portainer compatible)
# =============================================================================
#
#  CONFIG — two options, env vars take priority:
#
#  A) Env vars (recommended for Portainer, no file mount needed):
#     Set MESH_NODE_NAME, MESH_PUBLIC_IP, and any MESH_* vars below.
#     Copy .env.example → .env for local dev.
#
#  B) YAML file (optional local-dev fallback):
#     Leave MESH_NODE_NAME unset and uncomment the mesh.yaml volume in core.
#
# =============================================================================
#
#  OPTIONAL SERVICES — set individual ENABLE_* flags to "true" to activate:
#
#    ENABLE_WG=true          WireGuard manager
#    ENABLE_OPENVPN=true     OpenVPN server
#    ENABLE_HAPROXY=true     HAProxy TCP frontend (required for port 443)
#    ENABLE_CLOUDFLARE=true  Cloudflare DNS updater
#    ENABLE_ROUTER=true      ip route manager
#
#  All services are always present in the stack. When ENABLE_*=false (default)
#  the container starts and immediately exits — it uses no resources.
#  This approach works in Portainer, Swarm, and local docker compose.
#
# =============================================================================

x-core-env: &core-env
  ENABLE_WG:               ${ENABLE_WG:-false}
  ENABLE_OPENVPN:          ${ENABLE_OPENVPN:-false}
  ENABLE_HAPROXY:          ${ENABLE_HAPROXY:-false}
  ENABLE_CLOUDFLARE:       ${ENABLE_CLOUDFLARE:-false}
  ENABLE_ROUTER:           ${ENABLE_ROUTER:-false}
  MESH_NODE_NAME:          ${MESH_NODE_NAME:-}
  MESH_PUBLIC_IP:          ${MESH_PUBLIC_IP:-}
  MESH_WG_PORT:            ${MESH_WG_PORT:-51820}
  MESH_VPN_PORT:           ${MESH_VPN_PORT:-443}
  MESH_API_PORT:           ${MESH_API_PORT:-8080}
  MESH_UI_PORT:            ${MESH_UI_PORT:-3000}
  MESH_PRIORITY:           ${MESH_PRIORITY:-100}
  MESH_MODE:               ${MESH_MODE:-leader}
  MESH_JOIN_ADDR:          ${MESH_JOIN_ADDR:-}
  MESH_JOIN_TOKEN:         ${MESH_JOIN_TOKEN:-}
  MESH_CLIENT_SUBNET:      ${MESH_CLIENT_SUBNET:-10.8.0.0/24}
  MESH_SUBNET:             ${MESH_SUBNET:-10.99.0.0/24}
  MESH_ALLOWED_LAN:        ${MESH_ALLOWED_LAN:-192.168.100.0/24}
  MESH_ROUTING_MODE:       ${MESH_ROUTING_MODE:-weighted}
  MESH_ROUTING_WEIGHT:     ${MESH_ROUTING_WEIGHT:-100}
  MESH_HEALTH_INTERVAL:    ${MESH_HEALTH_INTERVAL:-3}
  MESH_FAILOVER_THRESHOLD: ${MESH_FAILOVER_THRESHOLD:-3}
  ADMIN_PASSWORD:          ${ADMIN_PASSWORD:-admin}
  MESH_CORS_ORIGINS:       ${MESH_CORS_ORIGINS:-}
  CF_ENABLED:              ${CF_ENABLED:-false}
  CF_API_TOKEN:            ${CF_API_TOKEN:-}
  CF_ZONE_ID:              ${CF_ZONE_ID:-}
  CF_DOMAIN:               ${CF_DOMAIN:-vpn.yourdomain.com}
  CF_TTL:                  ${CF_TTL:-60}


services:

  # ── Core mesh daemon ─────────────────────────────────────────────────────────
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "${MESH_API_PORT:-8080}:8080"
    volumes:
      - meshvpn-data:/data
      # Option B — YAML-file config (used when MESH_NODE_NAME is not set):
      - ./mesh.yaml:/etc/meshvpn/mesh.yaml:ro
    environment:
      <<: *core-env
    networks:
      - meshvpn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Web UI ───────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${MESH_UI_PORT:-3000}:3000"
    environment:
      # Where the browser hits the API. Leave EMPTY to use nginx's built-in
      # proxy (frontend → core on the docker network). Set to an absolute URL
      # when frontend and API are served from different origins, e.g.
      #   API_URL=http://localhost:8080          local dev, direct-to-core
      #   API_URL=https://vpn.example.com        behind a reverse proxy
      API_URL: "${API_URL:-}"
    networks:
      - meshvpn
    restart: unless-stopped
    depends_on:
      - core

  # ── WireGuard manager ────────────────────────────────────────────────────────
  # Set ENABLE_WG=true to activate. When false the container exits 0 and stays stopped.
  wg-manager:
    build:
      context: .
      dockerfile: wg-manager/Dockerfile
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_WG: "${ENABLE_WG:-false}"
      CORE_API: "http://127.0.0.1:${MESH_API_PORT:-8080}"
    restart: on-failure

  # ── ip route manager ─────────────────────────────────────────────────────────
  # Set ENABLE_ROUTER=true to activate.
  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_ROUTER: "${ENABLE_ROUTER:-false}"
      CORE_API: "http://127.0.0.1:${MESH_API_PORT:-8080}"
    restart: on-failure

  # ── OpenVPN server ───────────────────────────────────────────────────────────
  # Set ENABLE_OPENVPN=true to activate. Runs on the meshvpn bridge — HAProxy
  # reaches it by DNS at openvpn:1194. Client subnet traffic is NAT'd out
  # through the container's eth0 (start.sh installs the MASQUERADE rule).
  openvpn:
    build:
      context: .
      dockerfile: openvpn/Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - meshvpn-data:/data
    networks:
      - meshvpn
    environment:
      ENABLE_OPENVPN: "${ENABLE_OPENVPN:-false}"
      MESH_CLIENT_SUBNET: "${MESH_CLIENT_SUBNET:-10.8.0.0/24}"
    restart: on-failure

  # ── HAProxy TCP frontend ──────────────────────────────────────────────────────
  # Set ENABLE_HAPROXY=true to activate. Required to expose port 443 for VPN clients.
  haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    ports:
      - "${MESH_VPN_PORT:-443}:443"
    networks:
      - meshvpn
    environment:
      ENABLE_HAPROXY: "${ENABLE_HAPROXY:-false}"
    restart: on-failure

  # ── Cloudflare DNS updater ────────────────────────────────────────────────────
  # Set ENABLE_CLOUDFLARE=true to activate.
  cloudflare:
    build:
      context: .
      dockerfile: cloudflare/Dockerfile
    volumes:
      - meshvpn-data:/data
    environment:
      ENABLE_CLOUDFLARE: "${ENABLE_CLOUDFLARE:-false}"
      CORE_API:     "http://core:${MESH_API_PORT:-8080}"
      CF_ENABLED:   ${CF_ENABLED:-false}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID:   ${CF_ZONE_ID:-}
      CF_DOMAIN:    ${CF_DOMAIN:-vpn.yourdomain.com}
      CF_TTL:       ${CF_TTL:-60}
    networks:
      - meshvpn
    restart: on-failure
    depends_on:
      - core


volumes:
  meshvpn-data:

networks:
  meshvpn:
    driver: bridge
